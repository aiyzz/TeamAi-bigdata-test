schema_version: v1alpha1

environment:
  type: none

skills:
  - source: local_path
    path: .

engine:
  name: claude_code
  model:
    provider: anthropic
    name: mimo-v2.5-pro
    base_url: "https://api.xiaomimimo.com/anthropic"

cases:
  files:
    - evals/cases/mode-detection.yaml
    - evals/cases/missing-info-asks.yaml
    - evals/cases/config-generation.yaml
  defaults:
    timeout_seconds: 120
    max_turns: 8

report:
  formats: [json]
